apiVersion: v1
kind: ServiceAccount
metadata:
  name: healops-kube-state-metrics
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-kube-state-metrics
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: healops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healops-kube-state-metrics
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-kube-state-metrics
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: healops
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healops-kube-state-metrics
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-kube-state-metrics
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: healops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: healops-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: healops-kube-state-metrics
    namespace: healops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healops-kube-state-metrics
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-kube-state-metrics
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: healops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healops-kube-state-metrics
  template:
    metadata:
      labels:
        app: healops-kube-state-metrics
        app.kubernetes.io/name: healops-kube-state-metrics
        app.kubernetes.io/component: exporter
        app.kubernetes.io/part-of: healops
    spec:
      serviceAccountName: healops-kube-state-metrics
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
          imagePullPolicy: IfNotPresent
          args:
            - "--port=8080"
            - "--telemetry-port=8081"
            - "--namespaces=healops"
            - "--resources=deployments,pods,replicasets"
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: healops-kube-state-metrics
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-kube-state-metrics
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: healops
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: telemetry
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: healops-kube-state-metrics
