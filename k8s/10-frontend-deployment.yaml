apiVersion: apps/v1
kind: Deployment
metadata:
  name: healops-frontend
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: healops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: healops-frontend
  template:
    metadata:
      labels:
        app: healops-frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: healops-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx-config
