apiVersion: v1
kind: Service
metadata:
  name: healops-postgres
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: healops
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: healops-postgres
