apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: healops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
