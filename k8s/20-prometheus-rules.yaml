apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: healops
data:
  alert.rules.yml: |
    groups:
      - name: healops-alerts
        rules:
          - alert: BackendUnavailable
            expr: (up{job="healops-backend"} == 0) or (absent(up{job="healops-backend"}) == 1)
            for: 1m
            labels:
              severity: critical
              component: backend
              category: availability
            annotations:
              summary: "HealOps Backend instance is unavailable"
              description: "The HealOps backend target is down (up == 0) or missing from Prometheus scrape targets for more than 1 minute."

          - alert: HighHTTPErrorRate
            expr: (sum(rate(http_requests_total{job="healops-backend",route!~"/metrics|/health|/ready",code=~"5.."}[5m])) / sum(rate(http_requests_total{job="healops-backend",route!~"/metrics|/health|/ready"}[5m]))) * 100 > 10 and sum(rate(http_requests_total{job="healops-backend",route!~"/metrics|/health|/ready"}[5m])) > 0.1
            for: 2m
            labels:
              severity: critical
              component: backend
              category: performance
            annotations:
              summary: "High HTTP 5xx error rate on HealOps Backend"
              description: "HTTP 5xx error rate exceeds 10% over 5 minutes with active traffic (> 0.1 req/s)."

          - alert: HighAPILatency
            expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="healops-backend",route!~"/metrics|/health|/ready"}[5m]))) > 1.5 and sum(rate(http_request_duration_seconds_count{job="healops-backend",route!~"/metrics|/health|/ready"}[5m])) > 0.1
            for: 3m
            labels:
              severity: warning
              component: backend
              category: performance
            annotations:
              summary: "High P95 latency on HealOps Backend"
              description: "95th percentile HTTP request duration exceeds 1.5s over a 5-minute window with active traffic."

          - alert: HighContainerMemoryUsage
            expr: (container_memory_working_set_bytes{namespace="healops",container!=""} / container_spec_memory_limit_bytes{namespace="healops",container!=""}) * 100 > 85 and on(namespace, pod, container) (container_spec_memory_limit_bytes{namespace="healops",container!=""} > 0 and container_spec_memory_limit_bytes{namespace="healops",container!=""} < 1e14)
            for: 3m
            labels:
              severity: warning
              component: infrastructure
              category: resource
            annotations:
              summary: "High container memory working set usage in {{ $labels.pod }}/{{ $labels.container }}"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | printf \"%.1f\" }}% of its memory limit (threshold > 85%)."

          - alert: HighCPUThrottling
            expr: (sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{namespace="healops",container!=""}[5m])) / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{namespace="healops",container!=""}[5m]))) * 100 > 25 and sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{namespace="healops",container!=""}[5m])) > 0
            for: 3m
            labels:
              severity: warning
              component: infrastructure
              category: resource
            annotations:
              summary: "High CPU throttling detected in {{ $labels.pod }}/{{ $labels.container }}"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has experienced > 25% CPU CFS throttled periods over 5m."

          - alert: PodRestartSpike
            expr: sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace="healops"}[15m])) > 2
            for: 1m
            labels:
              severity: critical
              component: infrastructure
              category: stability
            annotations:
              summary: "Pod restart spike detected for {{ $labels.pod }}/{{ $labels.container }}"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in the last 15 minutes."

          - alert: PodUnavailable
            expr: (kube_pod_status_phase{namespace="healops",phase=~"Failed|Unknown"} == 1) or (min_over_time(kube_pod_status_phase{namespace="healops",phase="Pending"}[5m]) == 1)
            for: 5m
            labels:
              severity: critical
              component: infrastructure
              category: availability
            annotations:
              summary: "Pod {{ $labels.pod }} is in unavailable or stuck phase"
              description: "Pod {{ $labels.pod }} has been in Failed, Unknown, or persistently Pending phase for more than 5 minutes."

          - alert: DeploymentUnavailable
            expr: (kube_deployment_spec_replicas{namespace="healops"} - kube_deployment_status_replicas_available{namespace="healops"}) > 0
            for: 5m
            labels:
              severity: critical
              component: infrastructure
              category: availability
            annotations:
              summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
              description: "Deployment {{ $labels.deployment }} has desired replicas exceeding available replicas for more than 5 minutes."
