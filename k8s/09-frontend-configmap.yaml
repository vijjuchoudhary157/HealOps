apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: healops
data:
  default.conf: |
    server {
        listen 80;

        # Serve React App
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://healops-backend:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy Health/Ready/Metrics endpoints
        location /health {
            proxy_pass http://healops-backend:5000/health;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://healops-backend:5000/ready;
            proxy_set_header Host $host;
        }

        location /metrics {
            proxy_pass http://healops-backend:5000/metrics;
            proxy_set_header Host $host;
        }
    }
