apiVersion: apps/v1
kind: Deployment
metadata:
  name: healops-backend
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: healops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: healops-backend
  template:
    metadata:
      labels:
        app: healops-backend
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: healops-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
