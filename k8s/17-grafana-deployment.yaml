apiVersion: apps/v1
kind: Deployment
metadata:
  name: healops-grafana
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: healops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: healops-grafana
  template:
    metadata:
      labels:
        app: healops-grafana
        app.kubernetes.io/component: monitoring
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: grafana-config-volume
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: grafana-config-volume
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: grafana-config-volume
              mountPath: /var/lib/grafana/dashboards/healops-dashboard.json
              subPath: healops-dashboard.json
            - name: grafana-config-volume
              mountPath: /var/lib/grafana/dashboards/healops-k8s-infrastructure.json
              subPath: healops-k8s-infrastructure.json
      volumes:
        - name: grafana-config-volume
          configMap:
            name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: healops-grafana
  namespace: healops
  labels:
    app.kubernetes.io/name: healops-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: healops
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: healops-grafana
