  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - healops-alertmanager.healops.svc.cluster.local:9093

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'healops-backend'
        metrics_path: '/metrics'
        scrape_interval: 5s
        static_configs:
          - targets: ['healops-backend.healops.svc.cluster.local:5000']
            labels:
              app: 'healops-backend'
              environment: 'production-k8s'

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        metrics_path: '/metrics/cadvisor'
        scrape_interval: 10s
        scrape_timeout: 10s
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /etc/prometheus/kubelet-ca.crt
          server_name: desktop-control-plane
          insecure_skip_verify: false
        static_configs:
          - targets: ['desktop-control-plane:10250']
            labels:
              node: 'desktop-control-plane'
        metric_relabel_configs:
          - source_labels: [namespace]
            action: keep
            regex: healops
          - source_labels: [container]
            action: drop
            regex: ''
          - source_labels: [__name__]
            action: keep
            regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_usage_bytes|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_throttled_seconds_total|container_spec_cpu_quota|container_spec_cpu_period|container_spec_memory_limit_bytes'

      - job_name: 'kube-state-metrics'
        scrape_interval: 10s
        scrape_timeout: 10s
        static_configs:
          - targets: ['healops-kube-state-metrics.healops.svc.cluster.local:8080']
            labels:
              app: 'healops-kube-state-metrics'
        metric_relabel_configs:
          - source_labels: [namespace]
            action: keep
            regex: healops
          - source_labels: [__name__]
            action: keep
            regex: 'kube_pod_container_status_restarts_total|kube_pod_container_status_last_terminated_reason|kube_pod_status_phase|kube_pod_container_status_waiting_reason|kube_pod_container_info|kube_deployment_spec_replicas|kube_deployment_status_replicas_available|kube_deployment_status_replicas_unavailable|kube_deployment_status_replicas_updated|kube_deployment_status_replicas'
