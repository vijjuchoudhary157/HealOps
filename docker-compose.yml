
services:
  postgres:
    image: postgres:15-alpine
    container_name: healops_postgres
    environment:
      POSTGRES_USER: healops
      POSTGRES_PASSWORD: healops_pass
      POSTGRES_DB: healops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healops -d healops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healops_backend
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://healops:healops_pass@postgres:5432/healops
      - JWT_SECRET=your_jwt_secret_here
      - ALERTMANAGER_WEBHOOK_TOKEN=your_alertmanager_webhook_token_here
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: healops_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
